[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciline"
version = "0.2.0"
description = "A high-performance, cross-platform real-time ASCII video rendering engine."
requires-python = ">=3.9"
authors = [
    { name = "YusufB5" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
ytdlp = [
    "yt-dlp>=2026.07.04",
]
# Everything needed to run the complete test suite (pytest incl. the
# TestClient-based transport tests, which need httpx):
#   pip install -e ".[test]"   (plus ffmpeg on PATH for the video tests)
test = [
    "pytest",
    "httpx",
]

[tool.setuptools]
py-modules = [
    "ascii_video_player2",
    "codec",
    "compiler",
    "logo",
    "stream_server",
    "ytdl",
]
